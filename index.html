<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aero OS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- top nav bar -->
    <div class="top_nav_bar" id="top_nav_bar">
        <p>AeroOS</p>
        <p id="top_nav_bar_time"></p>
    </div>

    <!-- welcome -->
    <div class="welcome" id="welcome">
        <div class="welcomeheader" id="welcomeheader">
        </div>

        <div class="welcome_content" id="welcome_content">
            <h1>Welcome</h1>
            <p>AeroOS the OS simulation used in airport terminal!</p>
        </div>
    </div>

    <!-- bottom nav bar -->
    <div class="bottom_nav_bar" id="bottom_nav_bar">
        <div class="bottom_nav_bar_left" id="bottom_nav_bar_left">
            <div class="bottom_nav_bar_lines_left" id="bottom_nav_bar_lines_left">
                <div id="bottom_nav_bar_line_left"></div>
                <div id="bottom_nav_bar_line_left"></div>
                <div id="bottom_nav_bar_line_left"></div>
            </div>
        </div>

        <div class="bottom_nav_bar_right" id="bottom_nav_bar_right">

        </div>
    </div>

    <!-- icons -->
    <div class="icons" id="icons">
        <div class="icon" id="icon_1">✈️</div>
    </div>

    <!-- overview -->
     <div class="overview" id="overview">
        <div class="overviewheader" id="overviewheader">
            <div class="close_icon" id="overview_close_icon"></div>
            <div class="mini_icon" id="overview_mini_icon"></div>
            <div class="full_icon" id="overview_full_icon"></div>
        </div>

        <div class="overview_content" id="overview_content">

        </div>
     </div>
    <script src="script.js"></script>
</body>

</html>
