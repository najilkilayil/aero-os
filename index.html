<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aero OS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- top nav bar -->
    <div class="top_nav_bar" id="top_nav_bar">
        <p>AeroOS</p>
        <p id="top_nav_bar_time"></p>
    </div>

    <!-- welcome -->
    <div class="welcome" id="welcome">
        <div class="welcomeheader" id="welcomeheader">
        </div>

        <div class="welcome_content" id="welcome_content">
            <h1>Welcome</h1>
            <p>AeroOS the OS simulation used in airport terminal!</p>
        </div>
    </div>

    <!-- bottom nav bar -->
    <div class="bottom_nav_bar" id="bottom_nav_bar">
        <div class="bottom_nav_bar_left" id="bottom_nav_bar_left">
            <div class="bottom_nav_bar_lines_left" id="bottom_nav_bar_lines_left">
                <div id="bottom_nav_bar_line_left"></div>
                <div id="bottom_nav_bar_line_left"></div>
                <div id="bottom_nav_bar_line_left"></div>
            </div>
        </div>

        <div class="bottom_nav_bar_right" id="bottom_nav_bar_right">

        </div>
    </div>

    <!-- icons -->
    <div class="icons" id="icons">
        <div class="icon" id="icon_1">✈️</div>
    </div>

    <!-- overview -->
     <div class="overview" id="overview">
        <div class="overviewheader" id="overviewheader">
            <div class="close_icon" id="overview_close_icon"></div>
            <div class="mini_icon" id="overview_mini_icon"></div>
            <div class="full_icon" id="overview_full_icon"></div>

            <div class="heading" id="over_view_heading">Flight Overview</div>
        </div>

        <div class="overview_content" id="overview_content">
            <div class="overview_sections" id="overview_sections">
                <div class="overview_departure" id="overview_departure">
                    Departures
                </div>
                <div class="overview_arrival" id="overview_arrival">
                    Arrivals
                </div>
            </div>

            <div class="overview_content_area" id="overview_content_area">
                <div class="overview_content_departure" id="overview_content_departure">
                    <table>
                        <tr>
                            <th>flight</th>
                            <th>destination</th>
                            <th>gate</th>
                            <th>time</th>
                            <th></th>
                            <th>status</th>
                        </tr>

                        <tbody id="departure_table_body"></tbody>
                    </table>
                </div>
            </div>

            <div class="overview_content_arrival" id="overview_content_arrival">
                <table>
                    <tr>
                        <th>flight</th>
                        <th>from</th>
                        <th>gate</th>
                        <th>time</th>
                        <th> </th>
                        <th>status</th>
                    </tr>

                    <tbody id="arrival_table_body"></tbody>
                </table>
            </div>
        </div>
     </div>
    <script src="script.js"></script>
</body>

</html>
